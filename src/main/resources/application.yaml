spring:
  application:
    name: credit-app
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password:
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties.format_sql: true
logging:
  level:
    org.hibernate.SQL: DEBUG
